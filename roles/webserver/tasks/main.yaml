---
- name: Ensure Apache is installed
  ansible.builtin.package:
    name: apache2
    state: present

- name: Ensure Apache is running
  ansible.builtin.service:
    name: apache2
    enabled: true
    state: started

- name: Ensure mod_wsgi is installed
  ansible.builtin.package:
    name: libapache2-mod-wsgi-py3
    state: present
